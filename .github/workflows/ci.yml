name: Проверка Python

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Проверить тестовый каркас
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Проверить CLI
        env:
          PYTHONPATH: src
        run: python -m mail_organizer --version

      - name: Проверить Stage 0 VPS audit script
        run: |
          bash -n deploy/check-stage0-vps.sh
          bash deploy/check-stage0-vps.sh --help > /dev/null
          bash tests/test_stage0_vps_os.sh

      - name: Проверить автономный dry-run на искусственных данных
        env:
          PYTHONPATH: src
        run: python -m mail_organizer sync --dry-run --fixture tests/fixtures/offline_messages.json --policy-dir policy
